<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>Нарды · человек vs агент</title>
<link rel="stylesheet" href="/vendor/bgboard/css/bgboard.css"/>
<style>
  body{font-family:sans-serif;background:#1b1f27;color:#dfe6ee;margin:0;display:flex;flex-direction:column;align-items:center;}
  h1{font-size:20px;margin:12px 0 4px;}
  .bar{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px;}
  .btn{background:#2f6f4e;border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;}
  .playarea{display:flex;gap:16px;align-items:flex-start;}
  #boardbox{position:relative;}
  #sidepanel{display:flex;flex-direction:column;gap:12px;}
  #dicebox{display:flex;flex-direction:column;align-items:center;gap:12px;background:#232a36;padding:14px;border-radius:10px;min-width:150px;}
  #dice{display:flex;gap:8px;min-height:44px;align-items:center;}
  #dice img{width:44px;height:44px;}
  #dice .blur img{filter:blur(3px);opacity:.5;}
  #turninfo{font-size:13px;color:#cfe;max-width:150px;text-align:center;}
  #status{font-size:14px;color:#cfe;min-height:18px;}
  #msg{font-size:13px;color:#ffd;min-height:16px;}
  #log{width:560px;max-height:160px;overflow:auto;background:#13151b;border:1px solid #333;
       font-family:monospace;font-size:11px;color:#9db;padding:6px;white-space:pre-wrap;margin-top:8px;}
  #meta{width:560px;background:#10141c;border:1px solid #2a3344;border-radius:6px;
        font-family:monospace;font-size:11px;color:#acb;
        padding:8px;margin:8px 0;white-space:pre-wrap;display:none;}
  .bgboard_position_info{display:none;}
  .hl{position:absolute;pointer-events:none;z-index:5;border-radius:8px;
      background:rgba(80,200,120,.25);border:2px solid rgba(80,200,120,.6);box-sizing:border-box;}
  .hl-src{background:rgba(120,160,255,.25);border-color:rgba(140,180,255,.7);}
  .hl-sel{background:rgba(255,200,80,.35);border-color:rgba(255,210,100,.85);}
  .hl-own{background:rgba(255,170,60,.18);border-color:rgba(255,180,80,.45);border-style:dashed;}
  .ptnum{position:absolute;pointer-events:none;z-index:4;width:24px;text-align:center;
         font-family:monospace;font-size:9px;color:rgba(255,255,255,.38);}
  .ptnum-bar{position:absolute;pointer-events:none;z-index:4;text-align:center;
         font-family:monospace;font-size:9px;color:rgba(255,255,255,.38);}
</style>
</head>
<body>
<h1>Нарды · человек vs агент</h1>
<div class="bar">
  <button class="btn" id="btnNew">Новая игра</button>
  <button class="btn" id="btnMeta">О сопернике</button>
  <span id="status"></span>
</div>
<div class="playarea">
  <div id="boardbox"><div id="board1"></div></div>
  <div id="sidepanel">
    <div id="dicebox">
      <div id="dice"></div>
      <div id="turninfo"></div>
    </div>
  </div>
</div>
<div id="msg"></div>
<div id="meta"></div>
<pre id="log"></pre>

<script src="/vendor/bgboard/js/bgboard.js"></script>
<script>
const FILES='/vendor/bgboard/';
const BAR=-1, OFF=99;

// маппинг bgboard-индекса -> наша точка: КЛАССИКА (как учился агент, GNU):
// pointi 0..23 совпадает с нашими точками зеркально ПАЛИНДРОМ:
//  pointi 0 = наш 23 (правый верх, №24), pointi 23 = наш 0 (правый низ, №1)
// дома справа: белые №19-24 (правый верх), красные №1-6 (правый низ)
const VIS=[]; for(let i=0;i<24;i++) VIS[i]= 23-i;

let board=null, state=null, side='white', roll=null, sel=null;
let agentRoll=null, thinking=false, busy=false;
let hints=[], srcSet=new Set(), dstBySrc={};
// stateless: состояние полностью на клиенте (localStorage), сервер только валидирует.
// Храним pos (и текущие кости клиента).
function saveState(){
  try{ localStorage.setItem('bg_state', JSON.stringify({pos:state, side:side, roll:roll})); }catch(e){}
}

function log(t){
  const el=document.getElementById('log');
  el.textContent='['+new Date().toLocaleTimeString()+'] '+t+'\n'+el.textContent;
  console.log(t);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setMsg(t){ document.getElementById('msg').textContent=t; }

function endMsg(){
  if(state && state.winner) setMsg('ИГРА ОКОНЧЕНА: ПОБЕДИЛИ '+(state.winner==='white'?'БЕЛЫЕ':'КРАСНЫЕ')+'!');
  else setMsg('ИГРА ОКОНЧЕНА');
}

async function api(p, body){
  log('POST '+p+' '+(body?JSON.stringify(body):''));
  const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({error:'не JSON: '+r.status}));
  log(' <- '+JSON.stringify(j).slice(0,300));
  return j;
}

function clearBoard(){
  const bg=board.container.querySelector('.bgboard_empty_board');
  board.container.innerHTML='';
  if(bg) board.container.appendChild(bg);
}

function rebuildHints(h){
  hints=h||[];
  srcSet=new Set(hints.map(s=>s[0]));
  dstBySrc={};
  for(const s of hints){ (dstBySrc[s[0]]=dstBySrc[s[0]]||new Set()).add(s[1]); }
}

// ── подсветка ──
function addHl(p, cls){
  const el=document.createElement('div');
  el.className='hl'+(cls?' '+cls:'');
  const cw=board.CHECK_SIDE_LENGTH;
  let w=cw, h=board.BOARD_HEIGHT/2-board.NUMBERS_ROW_HEIGHT, left=null, top=null, bottom=null;
  if(p===BAR){ w=2*cw; left=board.BAR_LEFT_OFFSET; top=board.NUMBERS_ROW_HEIGHT; }
  else if(p===OFF){ w=2*cw; h=board.BOARD_HEIGHT; }
  else{
    const bi= 23 - p;
    left=board.pointiToLeftOffset(bi)+'px';
    if(bi<=11) top=board.NUMBERS_ROW_HEIGHT+'px';
    else bottom=board.NUMBERS_ROW_HEIGHT+'px';
  }
  el.style.width=w+'px'; el.style.height=h+'px';
  if(left!==null) el.style.left=left;
  if(top!==null) el.style.top=top;
  if(bottom!==null) el.style.bottom=bottom;
  board.container.appendChild(el);
}

function dispOfPoint(p){
  // стандартная нумерация доски: 1 = правый нижний угол (наш p=0),
  // 24 = правый верхний угол (наш p=23). Везде: номер = p + 1.
  if(p===BAR) return 'BAR';
  if(p===OFF) return 'OFF';
  if(p>=0 && p<=23) return p+1;
  return p;
}

function drawColumnNumbers(){
  const wdoc = document;
  const cw = board.CHECK_SIDE_LENGTH;
  // верх: слева направо печатаем 13..24 ; низ: слева направо 12..1  (1 = правый низ, 24 = правый верх)
  for(let i=0;i<=23;i++){
    const isTop = i<=11;
    const num = 24 - i;
    const el=wdoc.createElement('div');
    el.className='ptnum';
    el.style.left=board.pointiToLeftOffset(i)+'px';
    el.style.fontSize='9px';
    if(isTop){ el.style.top='1px'; } else { el.style.bottom='1px'; }
    el.textContent=num;
    board.container.appendChild(el);
  }
  const bar=wdoc.createElement('div');
  bar.className='ptnum-bar';
  bar.style.left=(board.BAR_LEFT_OFFSET-8)+'px';
  bar.style.top='1px';
  bar.width='48px'; bar.style.width='48px';
  bar.textContent='BAR';
  board.container.appendChild(bar);
}

function drawHighlights(){
  document.querySelectorAll('#board1 .hl').forEach(e=>e.remove());
  if(!state || state.turn!==side || !roll || !roll.length) return;
  for(const p of srcSet){ addHl(p, sel===p?'hl-sel':'hl-src'); }
  if(sel!==null){ for(const d of (dstBySrc[sel]||new Set())) addHl(d); }
  for(let p=0;p<24;p++){ if(ownAt(p) && !srcSet.has(p)) addHl(p,'hl-own'); }
  if(ownAt(BAR) && !srcSet.has(BAR)) addHl(BAR,'hl-own');
}

function renderDice(){
  const el=document.getElementById('dice');
  el.innerHTML='';
  const shown = thinking && agentRoll ? agentRoll
              : (thinking ? null
              : (agentRoll || roll || null));
  if(shown && shown.length){
    const faces = shown.length===4 ? [shown[0],shown[0]] : [shown[0],shown[1]];
    for(const f of faces){ const im=new Image(); im.src=FILES+'img/die'+f+'.png'; el.appendChild(im); }
  }
  const ti=document.getElementById('turninfo');
  if(!state || state.terminal) ti.textContent='Игра окончена';
  else if(thinking) ti.textContent='Соперник думает…';
  else ti.textContent=(state.turn===side?'Твой ход':'Ход соперника')+' · ты '+(side==='white'?'белые':'чёрные');
}

function redraw(){
  if(!board){ board = new BgBoard({filesRoot:FILES, containerSelector:'#board1', scale:1.0}); }
  clearBoard();
  const arr=new Array(24);
  for(let i=0;i<24;i++) arr[i]=state.points[VIS[i]];
  board.arrPoints=arr;
  board.arrBar=[state.bar_white, state.bar_black];
  board.intCubeVal=0; board.isCrawford=true;
  board.intMatchLgh=0; board.intScoreW=0; board.intScoreB=0;
  board.strDice='';
  board.drawBoard();
  drawColumnNumbers();
  drawHighlights();
  renderDice();
  saveState();
  document.getElementById('status').textContent = state.terminal
    ? ('ПОБЕДИЛИ '+(state.winner==='white'?'БЕЛЫЕ':'КРАСНЫЕ')+'!')
    : 'Ход: '+(state.turn==='white'?'белых':'чёрных')+(state.turn===side?' (твой)':' (агент)');
}

function pointFromXY(x,y){
  const cw=board.CHECK_SIDE_LENGTH;
  const col=Math.floor(x/cw);
  const top=y < board.BOARD_HEIGHT/2;
  let bi=null;
  if(col>=2 && col<=7)     bi = top ? 13-col : 10+col;
  else if(col>=10 && col<=15) bi = top ? 15-col : 8+col;
  else if(col>=8 && col<=9)  return BAR;
  else if(col<=1 || col>=16) return OFF;
  else return null;
  return VIS[bi];
}

function ownAt(p){
  if(p===BAR) return side==='white'? state.bar_white>0 : state.bar_black>0;
  if(p<0 || p>23) return false;
  const v=state.points[p];
  return side==='white' ? v>0 : v<0;
}

// ── агент: бросок, пауза «думает», ход ──
async function agentTurn(){
  if(!state || state.terminal) return;
  if(state.turn===side) return;
  if(busy) return;
  busy=true; thinking=true; sel=null; rebuildHints([]);
  redraw();
  let r;
  if(agentRoll){
    r={roll:agentRoll};
  } else {
    setMsg('Соперник выбрасывает кости…');
    r=await api('/api/agent_roll',{pos:state});
  }
  if(r.turned){ // ходов нет — пропуск
    if(r.pos) state=r.pos;
    agentRoll=null; busy=false; thinking=false; redraw();
    setMsg('Соперник пропустил ход.');
    if(state.terminal){ endMsg(); return; }
    if(state.turn!==side){ agentTurn(); } else { return; }
    return;
  }
  if(!r.roll){ busy=false; thinking=false; redraw(); return; }
  agentRoll=r.roll;
  redraw();
  const ms = 4000 + Math.random()*3000;  // 4–7 секунд «думает»
  setMsg('Соперник выбрасывает: '+agentRoll.join(' '));
  await sleep(ms);
  const m=await api('/api/agent_move',{pos:state});
  if(m.error){ busy=false; thinking=false; setMsg(m.error); return; }
  agentRoll=null;
  const steps=m.steps||[];
  if(thinking) thinking=false;
  // поочередно подсвечиваем каждый шаг (сначала выбрасываемый шаг каждой фишки)
  for(const [fr,to] of steps){
    board.container.querySelectorAll('#board1 .hl').forEach(e=>e.remove());
    addHl(fr,'hl-src');
    addHl(to,'hl');
    state = { ...state };  // пока держим старую позицию (агент ещё не применил)
    await sleep(2500);
  }
  state=m.pos; thinking=false; redraw();
  if(state.terminal){ endMsg(); busy=false; return; }
  setMsg(m.moved? 'Соперник сходил ('+(m.agent==='value'?'value-net':'random')+').' : 'Соперник пропустил ход.');
  busy=false;
  if(state.turn!==side){ agentTurn(); }
}

// ── человек ──
document.getElementById('board1').addEventListener('click', async (e)=>{
  if(!state || state.terminal || busy || thinking) return;
  if(state.turn!==side){ log('клик, но ход агента'); return; }

  if(!roll){
    const r=await api('/api/roll',{pos:state});
    if(r.error){ setMsg(r.error); return; }
    if(r.turned){ state=r.pos; redraw(); setMsg('Нет ходов под бросок — переход хода.'); checkTurn(); return; }
    state=r.pos; roll=r.roll; sel=null;
    const h=await api('/api/steps',{pos:state});
    rebuildHints(h.steps);
    redraw();
    setMsg('Твой бросок: '+roll.join(' ')+'. Зелёные — ходы. Кликни фишку.');
    return;
  }

  const rect=e.currentTarget.getBoundingClientRect();
  const p=pointFromXY(e.clientX-rect.left, e.clientY-rect.top);
  if(p===null){ setMsg('Клик мимо доски'); return; }
  log('клик -> из='+(sel===null?'-':dispOfPoint(sel))+' в='+dispOfPoint(p));

  if(sel===null){
    if(srcSet.has(p)){ sel=p; redraw(); setMsg('Точка '+dispOfPoint(p)+' выбрана. Кликни цель (зелёная подсветка).'); }
    else if(ownAt(p)) setMsg('Точка '+dispOfPoint(p)+' — в доме/сюда хода нет под бросок '+roll.join('-')+' (цели закрыты или фишка уже у выноса).');
    else setMsg(p===BAR? 'Нет фишек на баре для входа' : 'Тут нет твоей фишки');
    return;
  }
  if(p===sel){ sel=null; redraw(); setMsg('Снял выбор.'); return; }

  const dsts=dstBySrc[sel]||new Set();
  if(dsts.has(p)){
    const fr=sel; sel=null;
    const r=await api('/api/step',{pos:state, from:fr, to:p});
    if(r.error){ setMsg(r.error); return; }
    state=r.pos;
    if(r.done){
      roll=null; rebuildHints([]); redraw();
      if(state.terminal){ endMsg(); return; }
      setMsg('Ход окончен.');
      checkTurn();
    } else {
      roll=r.roll;
      const h=await api('/api/steps',{pos:state});
      rebuildHints(h.steps);
      redraw();
      setMsg('Осталось костей: '+roll.join(' ')+'. Следующий шаг.');
    }
  } else {
    if(srcSet.has(p)){ sel=p; redraw(); setMsg('Перевыбрал фишку точки '+dispOfPoint(p)); }
    else setMsg('Невозможный ход: с точки '+dispOfPoint(sel)+' на '+dispOfPoint(p)+' ходить нельзя.');
  }
});

function checkTurn(){
  if(!state || state.terminal) return;
  if(state.turn!==side) agentTurn();
}

function applyNew(posObj, humanSide, msg){
  state=posObj; side=humanSide; roll=null; sel=null; agentRoll=null; rebuildHints([]); redraw();
  saveState();
  setMsg(msg);
  checkTurn();
}

async function startNew(humanSide, msg){
  const r=await api('/api/new',{});
  if(r.error){ setMsg(r.error); return; }
  applyNew(r.pos, humanSide, msg);
}

async function restoreGame(){
  const saved = localStorage.getItem('bg_state');
  if(!saved) return false;
  let d;
  try{ d=JSON.parse(saved); }catch(e){ return false; }
  if(!d || !d.pos) return false;
  state=d.pos; side=d.side||'white'; roll=d.roll||null; agentRoll=null;
  sel=null; rebuildHints([]); redraw();
  if(state.turn!==side) agentTurn();
  else if(roll) setMsg('Партия восстановлена. Твой бросок: '+roll.join(' ')+'. Кликни фишку.');
  else setMsg('Партия восстановлена. Кликни по доске, чтобы бросить.');
  return true;
}

document.getElementById('btnNew').addEventListener('click', ()=>{
  const next = side==='white' ? 'black' : 'white';
  startNew(next, 'Новая игра: ты за '+(next==='white'?'белые':'чёрные')+'. Кликни по доске, чтобы бросить.');
});
document.getElementById('btnMeta').addEventListener('click', async ()=>{
  const el=document.getElementById('meta');
  if(el.style.display!=='block'){
    const m=await api('/api/meta',{});
    el.textContent =
      'СОПЕРНИК\n' +
      '  модель:   '+m.model+'\n' +
      '  слой:     '+m.architecture+'\n' +
      '  обучение: '+m.training+'\n' +
      '  шагов:    '+m.iterations;
    el.style.display='block';
    setMsg('Спойлер: ты играешь против '+m.net.split(' (')[0]+'.');
  } else {
    el.style.display='none';
  }
});

(async function boot(){
  const ok = await restoreGame();
  if(!ok) await startNew('white', 'Новая партия: ты за белых. Кликни по доске, чтобы бросить.');
})();
</script>
</body>
</html>
