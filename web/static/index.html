<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>Нарды · человек vs агент</title>
<link rel="stylesheet" href="/vendor/bgboard/css/bgboard.css"/>
<style>
  body{font-family:sans-serif;background:#1b1f27;color:#dfe6ee;margin:0;display:flex;flex-direction:column;align-items:center;}
  h1{font-size:20px;margin:12px 0 4px;}
  #boardbox{position:relative;}
  .bar{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px;}
  .btn{background:#2f6f4e;border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;}
  #status{font-size:14px;color:#cfe;min-height:18px;}
  #msg{font-size:13px;color:#ffd;min-height:16px;}
</style>
</head>
<body>
<h1>Нарды · человек vs агент</h1>
<div class="bar">
  <button class="btn" id="btnNew">Новая игра</button>
  <span id="status"></span>
</div>
<div id="boardbox"><div id="board1"></div></div>
<div id="msg"></div>

<script src="/vendor/bgboard/js/bgboard.js"></script>
<script>
const FILES='/vendor/bgboard/';
let board=null, state=null, side='black', roll=null, legals=[], sel=null;

function redraw(pos){
  if(!board){ board = new BgBoard({filesRoot:FILES, containerSelector:'#board1', scale:1.0}); }
  // наш Position совпадает с GNU arrPoints (белые +, чёрные −, индексы 0..23)
  board.arrPoints = pos.points.slice();
  board.arrBar = [pos.bar_white, pos.bar_black];
  board.intDice = 0; board.strDice='';
  board.drawBoard();
  document.getElementById('status').textContent = pos.terminal? 'ИГРА ОКОНЧЕНА':
    'Ход: '+(pos.turn==='white'?'Белые':'Чёрные')+(pos.turn===side?' (твой)':' (агент)');
}

async function api(p, body){ const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); return r.json(); }

async function onRoll(){
  const r=await api('/api/roll',{pos:state});
  state=r.pos; roll=r.roll; legals=r.legal_moves; sel=null;
  redraw(state); document.getElementById('msg').textContent='Бросок: '+roll.join(' ')+' | кликни свою фишку';
}
async function agentGo(){
  const r=await api('/api/agent',{pos:state});
  state=r.pos; redraw(state);
}
async function doHumanMove(from,to){
  let chosen=null;
  for(const mv of legals){ const sts=mv; if(sts.length&&sts[0][0]===from&&sts[sts.length-1][1]===to){chosen=mv;break;} }
  if(!chosen){ document.getElementById('msg').textContent='Недопустимый ход'; return; }
  const r=await api('/api/move',{pos:state,roll,steps:chosen.map(s=>[s[0],s[1]])});
  if(r.error){ document.getElementById('msg').textContent=r.error; return; }
  state=r.pos; roll=null; legals=[]; sel=null; redraw(state);
  if(!state.terminal) await agentGo();
}
async function newGame(){
  side=(side==='black')?'white':'black';
  const r=await api('/api/new',{side}); state=r.pos; roll=null; legals=[]; sel=null;
  redraw(state);
  if(state.turn!==side) await agentGo();
}

// клики: по формулам bgboard (внешний клик по доске; перехватываем клик по столбцу)
document.getElementById('board1').addEventListener('click', async (e)=>{
  if(!state || state.terminal) return;
  if(state.turn!==side) return;
  if(!roll){ await onRoll(); return; }
  // определить индекс точки по координатам клика (формулы bgboard: pointiToLeftOffset)
  const rect=e.currentTarget.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  const LW=board.CHECK_SIDE_LENGTH||50;
  const col=Math.floor(x/LW);
  // воспроизводим формулу pointiToLeftOffset в обратную сторону
  const idx=pointFromCol(col);
  if(idx===null){ document.getElementById('msg').textContent='клик вне доски'; return; }
  if(sel===null){
    const v=state.points[idx];
    const own=(side==='white')?v:-v;
    if(own>0){ sel=idx; redraw(state); document.getElementById('msg').textContent='Фишка выбрана (точка '+idx+'). Кликни цель.'; }
    else document.getElementById('msg').textContent='Тут нет твоей фишки';
  } else {
    await doHumanMove(sel, idx);
  }
});

function pointFromCol(col){
  // обратная к pointiToLeftOffset (без бара): левая колонка = 2 (bearoff) смещение
  // берём приближённо: col 0..23
  if(col<0||col>23) return null;
  // формула bgboard: point=11-(col-2) для top при col>=2.. и т.д. — упростим прямым маппингом:
  // т.к. bgboard колонки: 0,1 = левый bearoff tray; 2..13 верх (правый→левый), 14=?, 15..26 низ
  // для MVP используем маппинг "24 точки по индексу arrPoints":
  // top: col 2..13 → pointi 11,10,...,0 ; низ: col 15..26 → pointi 12..23
  let p=null;
  if(col>=2&&col<=13){ p=11-(col-2); }
  else if(col>=15&&col<=26){ p=12+(col-15); }
  return p;
}

document.getElementById('btnNew').addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
