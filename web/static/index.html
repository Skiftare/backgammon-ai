<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>Нарды vs агент</title>
<style>
  body{font-family:sans-serif;background:#1b1f27;color:#dfe6ee;margin:0;display:flex;flex-direction:column;align-items:center;}
  h1{font-size:20px;margin:12px 0 4px;}
  #board{border:2px solid #3a4; background:#2a3b4c; border-radius:12px; cursor:pointer; margin-top:8px;}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:14px;}
  .btn{background:#2f6f4e;border:none;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;}
  .btn:hover{filter:brightness(1.15)}
  #status{font-size:14px;color:#cfe;margin-top:8px;min-height:18px;}
  #msg{font-size:13px;color:#ffd;margin-top:4px;min-height:16px;}
</style>
</head>
<body>
<h1>Нарды · человек vs агент</h1>
<div class="bar">
  <button class="btn" id="btnNew">Новая игра</button>
  <span id="status">Нажми «Новая игра»</span>
</div>
<canvas id="board" width="720" height="400"></canvas>
<div id="msg"></div>

<script>
const CV=document.getElementById('board'), ctx=CV.getContext('2d');
const W=CV.width, H=CV.height;
const TRI=12, TW=W/TRI, TH=H/2;
const PALETTE={white:'#f5f5f5', black:'#c0392b', bg:'#2c3e50', triA:'#7f8c8d', triB:'#b0b0b0', hl:'#f1c40f', sel:'#e67e22'};

let state=null;      // {points[], bar_*, home_*, turn, terminal}
let side='black';    // за кого человек
let roll=null;       // последний бросок человека [..]
let legals=[];       // полные легальные ходы (последовательностей шагов)
let sel=null;        // выбранная точка (source)

function triPoint(i){ // центр треугольника (верх/низ)
  const col=i%TRI;
  const x=col*TW+TW/2;
  const y = i<TRI ? H/2-30 : H/2+30;
  return {x,y};
}
function triAt(x,y){ // индекс по клику
  if(y<H/2){ const col=Math.floor(x/TW); return (col); }       // верх: 12..23? -> map
  else      { const col=Math.floor(x/TW); return TRI+col; }
}
// NOTE: координаты: индексы 0..23. Верхний ряд = 12..23, нижний = 0..11
function indexToXY(i){
  if(i>=12){ const c=i-12; return {x:(c+0.5)*TW, y:H/2-30}; } // верх 12..23 (слева=12)
  else     { const c=i;     return {x:(c+0.5)*TW, y:H/2+30}; } // низ 0..11
}
function xyToIndex(x,y){
  const c=Math.floor(x/TW);
  return (y<H/2) ? (12+c) : (c); // верх index 12+c
}

function ownAt(i){ const v=state.points[i]; return side==='white'? v: -v; }
// direction: человеческие фишки (сторона): we move +1 (white->23 / black->0)
function draw(){
  ctx.clearRect(0,0,W,H);
  // board bg
  ctx.fillStyle='#23343f'; ctx.fillRect(0,0,W,H);
  // triangles
  for(let i=0;i<24;i++){
    const x0=(i%TRI)*TW, y0=(i>=12?0:H/2);
    const up=(i>=12);
    const cx=(i%TRI)*TW+TW/2;
    const cy= up?0:H/2;
    ctx.beginPath();
    ctx.moveTo(x0, up?0:H/2);
    ctx.lineTo(x0+TW, up?0:H/2);
    ctx.lineTo(cx, up?TH:H);
    ctx.closePath();
    ctx.fillStyle = ((i%2)===0)?'#7f8c8d':'#b0b0b0';
    if(sel!==null&&i===sel) ctx.fillStyle='#e67e22';
    ctx.fill();
    // checkers
    const n=state.points[i];
    const own = side==='white'? n: -n;
    if(n){
      const cnt=Math.abs(n);
      const color= n>0?'white':'black';
      const {x,y}=indexToXY(i);
      const rad=16;
      for(let k=0;k<cnt && k<8;k++){
        const dy=(k%4)*rad*1.2;
        ctx.beginPath();ctx.arc(x, y + ((up?1:-1)*dy), rad,0,7);ctx.fillStyle=color;ctx.fill();
        ctx.strokeStyle='#000';ctx.stroke();
      }
    }
  }
  // highlight: for sel point, draw reachable targets
  if(sel!==null){
    const targets=new Set();
    for(const mv of legals){
      for(const st of mv){ if(st[0]===sel) targets.add(st[1]); }
    }
    for(const t of targets){ if(t===-1||t===99)continue; const {x,y}=indexToXY(t); ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fillStyle='rgba(241,196,15,.9)';ctx.fill(); }
  }
  // bars
  ctx.fillStyle='#cfd8dc';ctx.font='13px sans-serif';
  ctx.fillText('barW '+state.bar_white+'  barB '+state.bar_black+'  offW '+state.home_white+'  offB '+state.home_black, 12, H-6);
  ctx.fillStyle='#ffd';ctx.fillText('ход: '+(state.turn==='white'?'Белые':'Чёрные')+'| ты: '+(side), 12, 18);
}

async function api(path, body){ const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}); return r.json(); }
async function newGame(){ side = (side==='black')?'white':'black'; const r=await api('/api/new',{side}); state=r.pos; roll=null; legals=[]; sel=null; draw(); setStatus(); if(state.turn!==side){ await agentGo(); } }
async function setStatus(){ const who=state.turn==='white'?'Белые':'Чёрные'; document.getElementById('status').textContent=(state.terminal)? 'ИГРА ОКОНЧЕНА' : ('Ход: '+who+(state.turn===side?' (твой)':' (агент)')); }

async function agentGo(){
  setStatus(); draw();
  const r= await api('/api/agent',{pos: state});
  state=r.pos; draw(); setStatus();
}
async function onRoll(){
  const r=await api('/api/roll',{pos:state});
  state=r.pos; roll=r.roll; legals=r.legal_moves; sel=null;
  document.getElementById('msg').textContent='Бросок: '+roll.join(' ');
  draw();
}
async function doHumanMove(from,to){
  // найти legal move, последний шаг которого заканчивается на to и начинается с from
  let chosen=null;
  for(const mv of legals){
    const sts=mv; if(!sts.length)continue;
    if(sts[0][0]===from && sts[sts.length-1][1]===to){ chosen=mv; break; }
    // может начинаться с from (первый шаг)
    if(sts[0][0]===from){ chosen=mv; break; }
  }
  if(!chosen){ document.getElementById('msg').textContent='Этот ход нельзя (нет такого легального)'; return; }
  const steps=chosen.map(s=>[s[0],s[1]]);
  const r= await api('/api/move',{pos:state, roll:roll, steps});
  if(r.error){ document.getElementById('msg').textContent=r.error; return; }
  state=r.pos; roll=null; legals=[]; sel=null;
  draw(); setStatus();
  // агент отвечает
  if(!state.terminal) await agentGo();
}

CV.addEventListener('click', async (e)=>{
  const rect=CV.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  const idx=xyToIndex(x,y);
  if(state.turn!==side){ return; }  // не наша очередь
  if(!roll){ await onRoll(); return; } // нет броска — бросим
  // выбрать фишку или цель
  if(sel===null){
    if(ownAt(idx)>0){ sel=idx; draw(); }
    else document.getElementById('msg').textContent='Тут нет твоей фишки';
  } else {
    await doHumanMove(sel, idx);
  }
});

document.getElementById('btnNew').addEventListener('click', newGame);
// инициализация: новая игра
newGame();
</script>
</body>
</html>
